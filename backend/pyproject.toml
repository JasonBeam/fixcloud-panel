[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "fixcloud-panel-backend"
version = "0.1.0"
description = "FixCloud YAML visual management panel backend"
requires-python = ">=3.11"
dependencies = [
  "defusedxml>=0.7,<1",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic-settings>=2.7,<3",
  "python-multipart>=0.0.20,<1",
  "ruamel.yaml>=0.18,<0.19",
  "smbprotocol>=1.15,<2",
  "tzdata>=2025.1",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
test = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
