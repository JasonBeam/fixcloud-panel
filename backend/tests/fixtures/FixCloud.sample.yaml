port: 7890
socks-port: 7891
mixed-port: 7892
allow-lan: true
mode: rule
log-level: info
external-controller: 127.0.0.1:9090
secret: "masked-example"
experimental:
  quic-go-disable-gso: false
dns:
  enable: true
  listen: 0.0.0.0:1053
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver-policy:
    "geosite:cn":
      - https://dns.alidns.com/dns-query
  fake-ip-filter:
    - "*.lan"
proxy-providers:
  Remote:
    type: http
    url: https://example.invalid/subscription.yaml
    path: ./proxy_provider/remote.yaml
    interval: 86400
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
proxies:
  - name: localhost
    type: socks5
    server: 127.0.0.1
    port: 7891
    username: example
    password: example
    tls: true
    udp: true
proxy-groups:
  - name: Proxy
    type: select
    proxies:
      - localhost
      - DIRECT
  - name: Auto
    type: url-test
    use:
      - Remote
    filter: "(?i)HK|JP"
    include-all: false
    url: https://www.gstatic.com/generate_204
    interval: 300
rules:
  - RULE-SET,AdBlock,REJECT
  - GEOIP,CN,DIRECT
  - MATCH,Proxy
rule-providers:
  AdBlock:
    type: http
    behavior: classical
    url: https://example.invalid/rules/adblock.yaml
    path: ./rules/adblock.yaml
    interval: 86400

