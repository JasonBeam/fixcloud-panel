<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f5f5f5" />
  <title>FixCloud · Nothing 设计演示</title>
  <style>
    :root {
      color-scheme: light;
      --page: #f5f5f5; --surface: #fff; --raised: #f0f0f0; --line: #e8e8e8;
      --line-strong: #ccc; --ink: #1a1a1a; --muted: #666; --faint: #999;
      --red: #d71921; --green: #4a9e5c; --amber: #a77a17;
      --mono: "SF Mono", Menlo, Consolas, monospace;
      --sans: "SF Pro Display", "PingFang SC", -apple-system, BlinkMacSystemFont, sans-serif;
      --sidebar: 240px;
    }
    [data-theme="dark"] {
      color-scheme: dark; --page: #000; --surface: #111; --raised: #1a1a1a;
      --line: #222; --line-strong: #383838; --ink: #e8e8e8; --muted: #999;
      --faint: #666; --green: #79bd83; --amber: #dfbd68;
    }
    * { box-sizing: border-box; }
    html { min-height: 100%; background: var(--page); }
    body { min-width: 320px; min-height: 100dvh; margin: 0; color: var(--ink); background: var(--page); font-family: var(--sans); -webkit-font-smoothing: antialiased; }
    button, input, select, textarea { color: inherit; font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--red); outline-offset: 3px; }
    svg { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; flex: none; }
    .app { min-height: 100dvh; }
    .sidebar { position: fixed; z-index: 5; inset: 0 auto 0 0; display: flex; width: var(--sidebar); flex-direction: column; border-right: 1px solid var(--line); padding: 26px 18px 20px; background: var(--page); }
    .brand-kicker, .eyebrow, .micro, .nav-label, .mono { font-family: var(--mono); }
    .brand-kicker { color: var(--muted); font-size: 10px; letter-spacing: .13em; }
    .brand-name { margin-top: 4px; font-size: 23px; font-weight: 600; letter-spacing: -.055em; }
    .demo-mark { display: flex; align-items: center; gap: 8px; margin: 26px 10px 30px; color: var(--muted); font: 9px var(--mono); letter-spacing: .08em; }
    .signal { width: 7px; height: 7px; border-radius: 50%; background: var(--red); }
    .nav-label { padding: 0 10px 8px; color: var(--faint); font-size: 9px; letter-spacing: .14em; }
    .side-nav { display: grid; gap: 3px; }
    .side-nav button { position: relative; display: flex; min-height: 44px; align-items: center; gap: 12px; border: 0; border-radius: 8px; padding: 0 10px; color: var(--muted); background: transparent; text-align: left; font-size: 13px; }
    .side-nav button svg { width: 16px; height: 16px; }
    .side-nav button.active { color: var(--ink); background: var(--raised); }
    .side-nav button.active::before { position: absolute; inset: 12px auto 12px 0; width: 2px; background: var(--red); content: ""; }
    .side-nav button .nav-count { margin-left: auto; color: var(--faint); font: 9px var(--mono); }
    .sidebar-foot { margin-top: auto; border-top: 1px solid var(--line); padding: 14px 9px 0; color: var(--muted); font: 9px/1.8 var(--mono); }
    .sidebar-foot strong { display: flex; align-items: center; gap: 8px; color: var(--ink); font-weight: 400; }
    .sidebar-foot .signal { background: var(--red); }
    .main { min-height: 100dvh; margin-left: var(--sidebar); }
    .topbar { position: sticky; z-index: 4; top: 0; display: flex; min-height: 68px; align-items: center; justify-content: space-between; gap: 20px; border-bottom: 1px solid var(--line); padding: 0 34px; background: var(--page); }
    .top-left, .top-actions { display: flex; min-width: 0; align-items: center; gap: 12px; }
    .top-module { color: var(--muted); font-size: 13px; }
    .file-select { display: flex; max-width: 310px; min-height: 38px; align-items: center; gap: 10px; border: 0; border-left: 1px solid var(--line-strong); padding: 0 0 0 13px; background: transparent; text-align: left; }
    .file-select strong { overflow: hidden; font: 10px var(--mono); text-overflow: ellipsis; white-space: nowrap; }
    .file-select small { color: var(--muted); font: 8px var(--mono); white-space: nowrap; }
    .file-select svg { width: 13px; height: 13px; color: var(--muted); }
    .button { display: inline-flex; min-height: 40px; align-items: center; justify-content: center; gap: 8px; border: 1px solid var(--line-strong); border-radius: 999px; padding: 0 15px; background: transparent; font: 9px var(--mono); letter-spacing: .035em; transition: border-color .16s ease-out, background .16s ease-out, color .16s ease-out; }
    .button svg { width: 15px; height: 15px; }
    .button.icon { width: 40px; padding: 0; }
    .button.primary { border-color: var(--ink); color: var(--page); background: var(--ink); }
    .button.signal-button { border-color: var(--red); color: var(--red); }
    .button:disabled { opacity: .38; cursor: default; }
    .mobile-brand, .bottom-nav { display: none; }
    .content { width: min(100%, 1560px); margin: 0 auto; padding: 35px clamp(28px, 4vw, 68px) 76px; }
    .crumb { display: flex; align-items: center; gap: 8px; color: var(--muted); font: 9px var(--mono); letter-spacing: .1em; }
    .crumb .slash { color: var(--faint); }
    .hero { display: grid; grid-template-columns: minmax(0, 1fr) 210px; align-items: end; gap: 30px; margin: 27px 0 39px; }
    .hero h1 { max-width: 840px; margin: 0; font-size: clamp(48px, 6.2vw, 84px); font-weight: 500; line-height: .99; letter-spacing: -.075em; }
    .hero p { max-width: 500px; margin: 15px 0 0; color: var(--muted); font-size: 14px; line-height: 1.6; }
    .hero-index { position: relative; min-height: 132px; overflow: hidden; border: 1px solid var(--line-strong); border-radius: 14px; padding: 15px 16px; background: var(--surface); }
    .hero-index::after { position: absolute; inset: 0 0 0 37%; background-image: radial-gradient(circle, var(--line-strong) .8px, transparent .9px); background-size: 11px 11px; opacity: .65; content: ""; mask-image: linear-gradient(90deg, transparent, #000); }
    .hero-index .index-number { position: relative; z-index: 1; margin-top: 20px; font: 52px/.9 var(--mono); letter-spacing: -.1em; }
    .hero-index .index-label { position: relative; z-index: 1; margin-top: 8px; color: var(--muted); font: 8px var(--mono); letter-spacing: .12em; }
    .hero-index .signal { position: absolute; z-index: 2; top: 16px; right: 17px; }
    .overview-status { display: grid; grid-template-columns: minmax(0, 1fr) minmax(260px, .55fr); align-items: stretch; gap: 18px; margin: 27px 0 39px; }
    .status-update { min-width: 0; padding: 3px 0; }
    .status-meta { display: flex; align-items: center; gap: 11px; color: var(--muted); font: 9px var(--mono); }
    .status-meta .tag { text-transform: none; }
    .status-update h1 { max-width: 900px; margin: 17px 0 10px; font-size: clamp(42px, 5vw, 68px); font-weight: 500; line-height: 1.02; letter-spacing: -.07em; }
    .status-detail { margin: 0; color: var(--muted); font-size: 12px; }
    .status-link { display: inline-flex; min-height: 36px; align-items: center; gap: 8px; margin-top: 14px; border: 0; border-bottom: 1px solid var(--line-strong); padding: 0 1px; color: var(--ink); background: transparent; font: 9px var(--mono); }
    .status-link:hover { color: var(--red); border-color: var(--red); }
    .status-alert { display: flex; min-width: 0; flex-direction: column; justify-content: center; border: 1px solid var(--line); border-left: 2px solid var(--red); border-radius: 13px; padding: 18px 20px; background: var(--surface); }
    .status-alert h2 { margin: 15px 0 5px; font-size: 18px; font-weight: 500; }
    .status-alert p:not(.eyebrow) { margin: 0; color: var(--muted); font-size: 10px; line-height: 1.6; }
    .status-alert .status-link { align-self: flex-start; margin-top: 12px; }
    .history-actions { display: flex; flex: none; gap: 6px; }
    .history-actions .button { min-height: 32px; padding: 0 10px; font-size: 8px; }
    .delete-options { display: grid; gap: 8px; margin-top: 15px; }
    .delete-options > .button { justify-content: flex-start; border-radius: 8px; }
    .replace-option { display: flex; flex-wrap: wrap; gap: 8px; }
    .replace-option select { min-height: 38px; flex: 1; border: 1px solid var(--line-strong); border-radius: 8px; padding: 0 10px; background: var(--surface); }
    .eyebrow { margin: 0; color: var(--muted); font-size: 9px; letter-spacing: .13em; text-transform: uppercase; }
    .eyebrow.red { color: var(--red); }
    .section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 14px; margin: 0 0 10px; }
    .section-head h2 { margin: 0; color: var(--muted); font: 9px var(--mono); letter-spacing: .12em; text-transform: uppercase; }
    .section-head .count { color: var(--faint); font: 9px var(--mono); }
    .readout-grid { display: grid; grid-template-columns: 1.3fr 1fr 1fr; gap: 12px; margin: 0 0 38px; }
    .readout { min-height: 91px; border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; background: var(--surface); }
    .readout .readout-label { color: var(--muted); font: 8px var(--mono); letter-spacing: .1em; }
    .readout strong { display: block; margin-top: 10px; font: 22px var(--mono); letter-spacing: -.06em; }
    .readout strong small { color: var(--muted); font: 9px var(--mono); letter-spacing: 0; }
    .readout:first-child { display: flex; align-items: center; justify-content: space-between; }
    .readout:first-child strong { margin: 0; font-size: 28px; }
    .readout:first-child .readout-label { max-width: 110px; line-height: 1.7; }
    .category-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
    .category-card { min-width: 0; border: 1px solid var(--line); border-radius: 14px; padding: 17px 18px 8px; background: var(--surface); }
    .category-card .section-head { padding-bottom: 11px; border-bottom: 1px solid var(--line-strong); }
    .category-row { width: 100%; min-height: 56px; display: grid; grid-template-columns: 32px minmax(0, 1fr) auto 18px; align-items: center; gap: 12px; border: 0; border-bottom: 1px solid var(--line); padding: 7px 1px; background: transparent; text-align: left; }
    .category-row:last-child { border-bottom: 0; }
    .category-symbol { width: 27px; height: 27px; display: grid; place-items: center; border: 1px solid var(--line-strong); border-radius: 8px; font: 9px var(--mono); }
    .category-row .label { font-size: 13px; font-weight: 500; }
    .category-row .sub { display: block; margin-top: 3px; color: var(--muted); font: 8px var(--mono); }
    .category-row .count { color: var(--muted); font: 9px var(--mono); }
    .category-row .chevron, .row-chevron { color: var(--faint); font-size: 18px; transition: transform .16s ease-out; }
    .category-row:hover .label, .data-row:hover .data-title { color: var(--red); }
    .demo-note { min-height: 25px; margin: 13px 0 0; color: var(--muted); font: 9px/1.7 var(--mono); }
    .data-group { border: 1px solid var(--line); border-radius: 14px; padding: 4px 16px; background: var(--surface); }
    .data-row { width: 100%; min-width: 0; min-height: 68px; display: flex; align-items: center; gap: 13px; border: 0; border-bottom: 1px solid var(--line); padding: 10px 2px; background: transparent; text-align: left; }
    .data-row:last-child { border-bottom: 0; }
    .data-row .row-icon { width: 34px; height: 34px; display: grid; flex: none; place-items: center; border: 1px solid var(--line-strong); border-radius: 50%; font: 9px var(--mono); }
    .data-copy { min-width: 0; flex: 1; }
    .data-title { display: block; overflow: hidden; font-size: 13px; font-weight: 500; text-overflow: ellipsis; white-space: nowrap; }
    .data-sub { display: block; overflow: hidden; margin-top: 4px; color: var(--muted); font: 8px var(--mono); text-overflow: ellipsis; white-space: nowrap; }
    .data-meta { display: flex; align-items: center; gap: 8px; color: var(--muted); font: 8px var(--mono); text-align: right; }
    .tag { display: inline-flex; min-height: 21px; align-items: center; border: 1px solid var(--line-strong); border-radius: 999px; padding: 2px 8px; color: var(--muted); font: 8px var(--mono); letter-spacing: .025em; text-transform: uppercase; white-space: nowrap; }
    .tag.ok { border-color: var(--green); color: var(--green); }
    .tag.warn { border-color: var(--amber); color: var(--amber); }
    .tag.signal-tag { border-color: var(--red); color: var(--red); }
    .page-head { display: grid; grid-template-columns: 44px minmax(0, 1fr) 90px; align-items: center; gap: 8px; min-height: 50px; margin: 0 0 23px; }
    .page-head .back { width: 40px; height: 40px; display: grid; place-items: center; border: 1px solid var(--line-strong); border-radius: 50%; background: transparent; }
    .page-head h1 { margin: 0; text-align: center; font-size: 16px; font-weight: 500; }
    .page-head .right { justify-self: end; }
    .page-head .button { min-height: 38px; }
    .dirty { margin: -13px 0 20px; color: var(--red); text-align: center; font: 8px var(--mono); letter-spacing: .08em; }
    .search-tools { display: grid; grid-template-columns: minmax(180px, 1fr) auto auto; align-items: center; gap: 10px; margin: 0 0 15px; }
    .search { width: 100%; min-height: 41px; border: 0; border-bottom: 1px solid var(--line-strong); border-radius: 0; padding: 0 4px; color: var(--ink); background: transparent; font-size: 13px; }
    .search::placeholder { color: var(--faint); }
    .filter { min-height: 38px; border: 1px solid var(--line-strong); border-radius: 999px; padding: 0 13px; color: var(--muted); background: var(--surface); font: 8px var(--mono); }
    .list-meta { display: flex; align-items: center; justify-content: space-between; margin: 0 2px 8px; color: var(--muted); font: 8px var(--mono); letter-spacing: .04em; }
    .rule-type { width: 138px; flex: none; color: var(--ink); font: 10px var(--mono); }
    .rule-type small { display: block; margin-top: 4px; color: var(--muted); font-size: 8px; }
    .rule-target { max-width: 190px; overflow: hidden; color: var(--muted); text-align: right; text-overflow: ellipsis; white-space: nowrap; font: 9px var(--mono); }
    .detail-wrap { max-width: 900px; margin: 0 auto; }
    .form-section { margin: 0 0 26px; }
    .form-section h2 { margin: 0 0 8px 2px; color: var(--muted); font: 8px var(--mono); letter-spacing: .12em; text-transform: uppercase; }
    .form-card { overflow: hidden; border: 1px solid var(--line); border-radius: 14px; padding: 0 17px; background: var(--surface); }
    .form-row { min-height: 57px; display: flex; align-items: center; gap: 17px; border-bottom: 1px solid var(--line); padding: 9px 1px; }
    .form-row:last-child { border-bottom: 0; }
    .form-row label { min-width: 0; flex: 1; font-size: 12px; }
    .form-row label small { display: block; margin-top: 3px; color: var(--muted); font-size: 9px; }
    .form-row input[type="text"], .form-row input[type="number"], .form-row input[type="url"], .form-row select, .form-row textarea { width: min(55%, 440px); min-width: 0; border: 0; border-bottom: 1px solid transparent; border-radius: 0; padding: 5px 2px; color: var(--ink); background: transparent; text-align: right; font: 10px var(--mono); }
    .form-row input:focus, .form-row select:focus, .form-row textarea:focus { border-bottom-color: var(--ink); outline: 0; }
    .form-row select { appearance: none; cursor: pointer; text-align-last: right; }
    .value-button { max-width: 58%; display: inline-flex; align-items: center; gap: 8px; border: 0; padding: 8px 0; color: var(--muted); background: transparent; text-align: right; font: 9px var(--mono); }
    .value-button span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .value-button .chevron { color: var(--faint); font-size: 16px; }
    .toggle { position: relative; width: 44px; height: 26px; flex: none; appearance: none; border: 1px solid var(--line-strong); border-radius: 999px; background: var(--raised); cursor: pointer; }
    .toggle::before { position: absolute; top: 2px; left: 2px; width: 20px; height: 20px; border-radius: 50%; background: var(--muted); content: ""; transition: transform .16s ease-out, background .16s ease-out; }
    .toggle:checked { border-color: var(--ink); background: var(--ink); }
    .toggle:checked::before { transform: translateX(18px); background: var(--page); }
    .helper { margin: 8px 3px 0; color: var(--muted); font-size: 10px; line-height: 1.55; }
    .advanced-row { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; margin-top: 20px; }
    .text-action { border: 0; border-bottom: 1px solid var(--line-strong); padding: 9px 1px; color: var(--muted); background: transparent; font: 8px var(--mono); }
    .text-action.danger { color: var(--red); }
    .usage-head { display: flex; align-items: end; justify-content: space-between; gap: 22px; margin: 31px 0 36px; }
    .usage-head h1 { margin: 0; font-size: clamp(50px, 6vw, 76px); font-weight: 500; line-height: .95; letter-spacing: -.075em; }
    .usage-context { border-left: 1px solid var(--line-strong); padding: 2px 0 2px 15px; color: var(--muted); font: 8px/1.8 var(--mono); }
    .usage-context strong { display: block; color: var(--ink); font: 10px var(--mono); }
    .usage-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 13px; }
    .usage-card { min-width: 0; border: 1px solid var(--line); border-radius: 14px; padding: 17px; background: var(--surface); }
    .usage-card:first-child { grid-column: span 2; }
    .usage-card-head { display: flex; align-items: start; justify-content: space-between; gap: 10px; }
    .usage-card h2 { margin: 0; font-size: 14px; font-weight: 500; }
    .provider-name { display: block; margin-top: 4px; color: var(--muted); font: 8px var(--mono); }
    .quota { margin-top: 26px; font: clamp(25px, 3vw, 40px)/1.08 var(--mono); letter-spacing: -.07em; white-space: nowrap; }
    .quota small { color: var(--muted); font: 9px var(--mono); letter-spacing: 0; }
    .quota-percent { float: right; margin-top: 8px; color: var(--muted); font: 8px var(--mono); }
    .segments { height: 9px; display: grid; grid-template-columns: repeat(30, 1fr); gap: 2px; margin: 15px 0 18px; }
    .segments i { background: var(--line-strong); }
    .segments i.filled { background: var(--ink); }
    .segments i.warn { background: var(--amber); }
    .usage-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-top: 1px solid var(--line); }
    .usage-stats div { min-width: 0; padding: 11px 9px 0 0; }
    .usage-stats small { display: block; color: var(--muted); font: 7px var(--mono); letter-spacing: .07em; text-transform: uppercase; }
    .usage-stats strong { display: block; overflow: hidden; margin-top: 7px; font: 10px var(--mono); font-weight: 400; text-overflow: ellipsis; white-space: nowrap; }
    .usage-foot { margin: 13px 0 0; color: var(--muted); font: 8px var(--mono); }
    .source-grid { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(280px, .7fr); gap: 28px; }
    .source-card { border: 1px solid var(--line); border-radius: 14px; padding: 20px; background: var(--surface); }
    .source-card h2 { margin: 0 0 6px; font-size: 16px; font-weight: 500; }
    .source-path { color: var(--muted); font: 8px/1.8 var(--mono); overflow-wrap: anywhere; }
    .source-card .source-meta { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 18px; }
    .source-side .section-head { margin-top: 0; }
    .status-list { margin-top: 18px; border-top: 1px solid var(--line-strong); }
    .status-row { min-height: 43px; display: flex; align-items: center; justify-content: space-between; gap: 12px; border-bottom: 1px solid var(--line); font-size: 11px; }
    .status-row span { color: var(--muted); }
    .status-row strong { font: 8px var(--mono); font-weight: 400; text-align: right; }
    .node-toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 13px; }
    .node-toolbar .search { flex: 1; }
    .node-grid { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px; }
    .node-card { min-width: 0; min-height: 132px; border: 1px solid var(--line); border-radius: 13px; padding: 13px; background: var(--surface); transition: border-color .16s ease-out, background .16s ease-out; }
    .node-card:hover { border-color: var(--line-strong); background: var(--raised); }
    .node-card-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .node-glyph { width: 25px; height: 25px; display: grid; place-items: center; border: 1px solid var(--line-strong); border-radius: 50%; font: 8px var(--mono); }
    .node-card h3 { overflow: hidden; margin: 15px 0 4px; font-size: 11px; font-weight: 500; text-overflow: ellipsis; white-space: nowrap; }
    .node-card p { overflow: hidden; margin: 0; color: var(--muted); font: 7px var(--mono); text-overflow: ellipsis; white-space: nowrap; }
    .node-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 13px; color: var(--muted); font: 7px var(--mono); }
    .latency { color: var(--green); }
    .latency.slow { color: var(--amber); }
    .pagination { display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 19px; }
    .pagination button { width: 34px; height: 34px; border: 1px solid var(--line); border-radius: 50%; background: var(--surface); font: 8px var(--mono); }
    .pagination button.active { border-color: var(--ink); color: var(--page); background: var(--ink); }
    .pagination button:disabled { opacity: .4; cursor: default; }
    .empty-state { padding: 52px 15px; color: var(--muted); text-align: center; font: 9px var(--mono); }
    .two-columns { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 15px; }
    .settings-card { border: 1px solid var(--line); border-radius: 14px; padding: 16px; background: var(--surface); }
    .settings-card h2 { margin: 0 0 12px; color: var(--muted); font: 8px var(--mono); letter-spacing: .12em; }
    .settings-card .status-row:last-child { border-bottom: 0; }

        event.preventDefault();
        (event.shiftKey ? last : first).focus();
      } else if (event.shiftKey && document.activeElement === first) {
        event.preventDefault();
        last.focus();
      } else if (!event.shiftKey && document.activeElement === last) {
        event.preventDefault();
        first.focus();
      }
    });
    app.addEventListener('input', event => {
      const target = event.target;
      if (target.dataset.key) { setFieldValue(target); return; }
      if (target.id === 'list-search') { state.search = target.value; const position = target.selectionStart; render(); const next = document.getElementById('list-search'); next?.focus(); next?.setSelectionRange(position, position); }
      if (target.id === 'node-search') { state.search = target.value; state.nodePage = 1; const position = target.selectionStart; render(); const next = document.getElementById('node-search'); next?.focus(); next?.setSelectionRange(position, position); }
      if (target.id === 'picker-search') { const term = target.value.toLowerCase(); document.querySelectorAll('.picker-option').forEach(row => { row.hidden = !row.dataset.value.toLowerCase().includes(term); }); }
    });
    app.addEventListener('change', event => {
      const target = event.target;
      if (target.dataset.key) { setFieldValue(target); return; }
      if (target.id === 'list-filter') { state.filter = target.value; render(); }
      if (target.id === 'node-filter') { state.nodeFilter = target.value; state.nodePage = 1; render(); }
    });
    window.addEventListener('beforeunload', event => { if (state.dirty) { event.preventDefault(); event.returnValue = ''; } });
    render();
  </script>
</body>
</html>
