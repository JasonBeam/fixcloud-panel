title = "homelab custom rules"
[extend]
useDefault = true

[[rules]]
id = "cn-password-assignment"
description = "Chinese/English password assignment line"
regex = '''(?i)(密码|口令|password|passwd|pwd)\s*[:：=]\s*[^\s|]{6,}'''
keywords = ["密码", "口令", "password", "passwd", "pwd"]

[[rules]]
id = "subscription-url-token"
description = "Subscription URL carrying token or link path"
regex = '''https?://[^\s)"'\]]*(?:token=|/sub\?|/link/|subscribe\?|/api/v1/client/subscribe)[^\s)"'\]]{6,}'''
keywords = ["token=", "/sub?", "/link/", "subscribe", "/api/v1/client/subscribe"]

[[rules]]
id = "uuid-v4"
description = "UUID (VLESS/Trojan user id)"
regex = '''\b[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}\b'''
keywords = ["-"]

[[rules]]
id = "ss2022-key-context"
description = "Shadowsocks 2022 base64 key near cipher name"
regex = '''2022-blake3-[^\n]{0,120}?(?:[A-Za-z0-9+/]{22}==|[A-Za-z0-9+/]{43}=)'''
keywords = ["2022-blake3"]

[[rules]]
id = "reality-private-key-context"
description = "REALITY private key assignment"
regex = '''(?i)(?:private_key|privatekey)["']?\s*[:=]\s*["']?[A-Za-z0-9_-]{38,}'''
keywords = ["private_key", "privatekey", "privateKey"]

[[rules]]
id = "telegram-bot-token"
description = "Telegram bot token"
regex = '''\b[0-9]{8,10}:AA[A-Za-z0-9_-]{33}\b'''
keywords = [":AA"]

[[rules]]
id = "telegram-api-url"
description = "Telegram bot API URL with embedded token"
regex = '''https://api\.telegram\.org/bot[0-9]+:[A-Za-z0-9_-]+'''
keywords = ["api.telegram.org"]

[[rules]]
id = "age-secret-key"
description = "age identity secret key"
regex = '''AGE-SECRET-KEY-1[0-9A-Z]{58}'''
keywords = ["AGE-SECRET-KEY"]

[[rules]]
id = "pem-private-key"
description = "PEM private key block"
regex = '''-----BEGIN [A-Z ]*PRIVATE KEY-----'''
keywords = ["BEGIN"]

[[rules]]
id = "generic-secret-assignment"
description = "secret/token/apikey assignment with long value"
regex = '''(?i)\b(secret|token|apikey|api_key|access_key|auth_key|app_key)\b["']?\s*[:=]\s*["']?[A-Za-z0-9._+/=-]{16,}'''
keywords = ["secret", "token", "apikey", "api_key", "access_key", "auth_key", "app_key"]

[[rules]]
id = "bearer-token"
description = "Bearer authorization token"
regex = '''(?i)bearer\s+[A-Za-z0-9._~+/-]{20,}=*'''
keywords = ["bearer", "Bearer"]

[[rules]]
id = "email-address"
description = "Email address (PII)"
regex = '''[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}'''
keywords = ["@"]
[rules.allowlist]
regexTarget = "match"
regexes = ['''(?i)@example\.(com|org|net)''', '''(?i)@localhost''', '''(?i)@users\.noreply\.github\.com''', '''(?i)@sagernet''', '''(?i)@metacubex''']

[[rules]]
id = "cn-mobile-number"
description = "Chinese mainland mobile number (PII)"
regex = '''\b1[3-9][0-9]{9}\b'''
keywords = ["13", "14", "15", "16", "17", "18", "19"]
